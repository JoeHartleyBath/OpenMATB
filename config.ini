[Openmatb]
# If language is missing, en_EN will be loaded
language=en_EN

# If multiple screens layout, you can modify the index
# Default : screen_index=0
screen_index=0

# If you don't like the default font, feel free to specify a different one below.
# (Leave it empty to get your system default font)
font_name=

# Fullscreen mode
# Default : fullscreen=True
fullscreen=True

# Scenario choice
# Example  : scenario_path=Parasuraman_et_al_1993/high_reliability_block.txt
scenario_path=default.txt

# Display the session number at start
#
# MUST stay True for the adaptive_matb_2026 study. The wrapper does not show
# the vendor's session-ID modal: it monkey-patches Window.display_session_id
# (src/run_openmatb.py) and reuses that modal as the BLOCK-START DIALOG,
# feeding it OPENMATB_BLOCK_DIALOG_LINES -- the Familiarisation intro, the
# resting-baseline instruction, and the THREAT / SAFE condition primers. The
# patched function keeps this config guard, so setting it False suppresses the
# primers for every condition. It is also the participant's press-to-continue
# gate, so with it off, blocks start with no participant input.
#
# To suppress the dialog for one launch, set OPENMATB_SUPPRESS_BLOCK_DIALOG=1
# for that launch instead of touching this key.
display_session_number=True

# Hide the MATB environment on pause ("P" or "Escape" keys)
hide_on_pause=False

# Highlight widgets area of interest (AOI)
# If True, will display a red frame around each widget, as well as its name
highlight_aoi=False


# Vertical bounds between plugins areas
# (Warning: modify only if you need to change plugins from their initial default location)
# Default values: top_bounds=[0.35, 0.85] | bottom_bounds=[0.30, 0.85]
top_bounds=[0.35, 0.85]
bottom_bounds=[0.30, 0.85]